nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

api:
  image:
    repository: king-ai-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 2
  allowedOrigins: ""
  # Number of reverse proxies (ingress-nginx + any cloud LB) in front of the API.
  trustedProxyHops: 1
  javaOpts: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 120
  # Extra environment for capabilities without dedicated values (SSO/OIDC, MFA,
  # OCR, release governance). Use extraEnvFrom or valueFrom to keep credentials
  # in a Secret instead of rendering them into the ConfigMap.
  extraEnv: []
  extraEnvFrom: []
  # Compliance export storage. `local` writes to the exports volume; `s3` uses any
  # S3-compatible endpoint (MinIO, AWS S3, OSS) and makes the volume unnecessary.
  export:
    storage: local
    s3:
      endpoint: ""
      bucket: ""
      prefix: exports
      region: ""
      # Secret holding the credentials; required when storage=s3.
      existingSecret: ""
      accessKeyKey: access-key
      secretKeyKey: secret-key
  # Per-space monthly token budget and cost estimation. A space quota of 0 is
  # unlimited; prices are per 1M tokens and only affect the recorded cost.
  finops:
    quotaEnabled: true
    currency: USD
    defaultInputPricePerMillion: 0
    defaultOutputPricePerMillion: 0
  # Offline Ed25519 license. Create the Secret from the signed file:
  #   kubectl create secret generic king-ai-license --from-file=license.json=./license.json
  # publicKey accepts a base64url/base64 raw 32-byte key or a PEM public key.
  # When enabled with an invalid license the API refuses to start.
  license:
    enabled: false
    existingSecret: ""
    secretKey: license.json
    publicKey: ""
    mountPath: /app/license

ui:
  image:
    repository: king-ai-ui
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 30

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

externalDatabase:
  host: mysql.example.internal
  port: 3306
  database: king_ai
  existingSecret: king-ai-db
  usernameKey: username
  passwordKey: password
  sslMode: REQUIRED

externalRedis:
  host: redis.example.internal
  port: 6379
  existingSecret: king-ai-redis
  passwordKey: password
  sslEnabled: true

externalMilvus:
  url: http://milvus.example.internal:19530
  existingSecret: ""
  tokenKey: token
  # shared keeps one collection per embedding dimension partitioned by space_id;
  # per-kb keeps the legacy one-collection-per-knowledge-base layout.
  collectionMode: shared
  collectionPrefix: king_ai_chunks_v2
  partitionsNum: 64

appSecret:
  existingSecret: king-ai-app
  secretKey: app-secret
  encryptionKeyKey: encryption-key
  previousKeysKey: previous-keys

adminSecret:
  existingSecret: king-ai-admin
  usernameKey: username
  passwordKey: password

ingress:
  enabled: false
  className: nginx
  host: ai.example.com
  pathType: Prefix
  annotations: {}
  tls:
    enabled: true
    secretName: king-ai-tls
    # Set create=true and provide a PEM certificate/key to let the chart manage
    # the TLS Secret. Leave false when cert-manager or another controller owns it.
    create: false
    crt: ""
    key: ""
  sse:
    proxyReadTimeout: 600
    proxySendTimeout: 600
    bodySize: 25m

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # Custom metric scaling needs prometheus-adapter exposing king_ai_chat_active.
  # Leave empty on clusters without the adapter: an unavailable custom metric
  # stops the HPA from computing any replica count, disabling CPU scaling too.
  targetActiveStreams: ""

observability:
  tracing:
    enabled: false
    endpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
    sampleRate: 0.1
  metrics:
    scrapeAnnotations: true
pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  ingressPodLabels:
    app.kubernetes.io/name: ingress-nginx
  dnsNamespace: kube-system
  # Prometheus scrapes /actuator/prometheus directly; without this ingress rule
  # the default-deny policy blocks every scrape in a NetworkPolicy-enforcing CNI.
  metrics:
    enabled: true
    namespace: monitoring
    podLabels:
      app.kubernetes.io/name: prometheus
  egress:
    databaseCidrs: []
    redisCidrs: []
    milvusCidrs: []
    otelCidrs: []
    objectStorageCidrs: []
    publicHttps: true
    otelPort: 4318

persistence:
  exports:
    # enabled only provisions the PVC when mode=pvc. An exports volume is always
    # mounted, so the API never writes into the read-only root filesystem.
    enabled: true
    # emptyDir is installable on every cluster: exports survive pod lifetime but
    # not rescheduling (TTL is 24h by default). Switch to pvc for durable exports
    # and pick an accessMode the StorageClass actually supports.
    mode: emptyDir
    size: 20Gi
    storageClass: ""
    # ReadWriteMany requires an RWX-capable StorageClass (NFS, CephFS, EFS, ...);
    # with ReadWriteOnce and more than one API replica, exports only work on the
    # node that owns the volume.
    accessMode: ReadWriteOnce

migration:
  # Runs as the Job "<fullname>-migrate" (templates land in a later stage task)
  # executing SPRING_PROFILES_ACTIVE=prod,migrate before the API Deployment rolls.
  enabled: true
  backoffLimit: 0
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

devDependencies:
  enabled: false
  persistence:
    enabled: true
    storageClass: ""
    size: 8Gi
  mysql:
    enabled: true
    image: mysql:8.4
  redis:
    enabled: true
    image: redis:7-alpine
  milvus:
    enabled: true
    image: milvusdb/milvus:v2.5.4
    etcdImage: quay.io/coreos/etcd:v3.5.18
    minioImage: minio/minio:RELEASE.2024-12-18T13-15-44Z
  secrets:
    appSecret: ""
    encryptionKey: ""
    adminUsername: admin
    adminPassword: ""
    mysqlPassword: ""
    redisPassword: ""
    minioUser: ""
    minioPassword: ""

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "king-ai.apiName" . }}
  labels:
    {{- include "king-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "king-ai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      {{- if or .Values.observability.metrics.scrapeAnnotations .Values.api.podAnnotations }}
      annotations:
        {{- if .Values.observability.metrics.scrapeAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "king-ai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "king-ai.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "king-ai.fullname" . }}
            {{- with .Values.api.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
{{- include "king-ai.dbEnv" . | nindent 12 }}
{{- include "king-ai.redisEnv" . | nindent 12 }}
{{- include "king-ai.milvusEnv" . | nindent 12 }}
{{- include "king-ai.appSecretEnv" . | nindent 12 }}
{{- include "king-ai.adminEnv" . | nindent 12 }}
            {{- if eq (.Values.api.export.storage | default "local") "s3" }}
            {{- $s3 := .Values.api.export.s3 }}
            - name: KING_AI_EXPORT_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "api.export.s3.existingSecret is required when api.export.storage=s3" $s3.existingSecret }}
                  key: {{ $s3.accessKeyKey | default "access-key" }}
            - name: KING_AI_EXPORT_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "api.export.s3.existingSecret is required when api.export.storage=s3" $s3.existingSecret }}
                  key: {{ $s3.secretKeyKey | default "secret-key" }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: exports
              mountPath: /app/data/exports
            {{- if .Values.api.license.enabled }}
            - name: license
              mountPath: {{ .Values.api.license.mountPath | default "/app/license" }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.api.license.enabled }}
        - name: license
          secret:
            secretName: {{ required "api.license.existingSecret is required when api.license.enabled=true" .Values.api.license.existingSecret }}
            items:
              - key: {{ .Values.api.license.secretKey | default "license.json" }}
                path: license.json
        {{- end }}
        - name: exports
          {{- if and .Values.persistence.exports.enabled (eq .Values.persistence.exports.mode "pvc") }}
          persistentVolumeClaim:
            claimName: {{ include "king-ai.fullname" . }}-exports
          {{- else }}
          emptyDir: {}
          {{- end }}

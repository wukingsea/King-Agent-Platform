{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "king-ai.fullname" . }}-default-deny
  labels:
    {{- include "king-ai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - {{ include "king-ai.name" . }}
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - {{ .Release.Name }}
      - key: app.kubernetes.io/component
        operator: In
        values:
          - api
          - ui
          - migration
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "king-ai.apiName" . }}
  labels:
    {{- include "king-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      {{- include "king-ai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressPodLabels | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "king-ai.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: ui
      ports:
        - protocol: TCP
          port: 8080
    {{- if .Values.networkPolicy.metrics.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.metrics.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metrics.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range .Values.networkPolicy.egress.databaseCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - protocol: TCP
          port: {{ $.Values.externalDatabase.port }}
    {{- end }}
    {{- range .Values.networkPolicy.egress.redisCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - protocol: TCP
          port: {{ $.Values.externalRedis.port }}
    {{- end }}
    {{- range .Values.networkPolicy.egress.milvusCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - protocol: TCP
          port: 19530
    {{- end }}
    {{- range .Values.networkPolicy.egress.otelCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - protocol: TCP
          port: {{ $.Values.networkPolicy.egress.otelPort }}
    {{- end }}
    {{- range .Values.networkPolicy.egress.objectStorageCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- if .Values.networkPolicy.egress.publicHttps }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- if .Values.devDependencies.enabled }}
    {{- if .Values.devDependencies.mysql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "king-ai.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: mysql
      ports:
        - protocol: TCP
          port: 3306
    {{- end }}
    {{- if .Values.devDependencies.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "king-ai.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- if .Values.devDependencies.milvus.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "king-ai.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: milvus
      ports:
        - protocol: TCP
          port: 19530
    {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "king-ai.uiName" . }}
  labels:
    {{- include "king-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  podSelector:
    matchLabels:
      {{- include "king-ai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "king-ai.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "king-ai.migrateName" . }}
  labels:
    {{- include "king-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  podSelector:
    matchLabels:
      {{- include "king-ai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: migration
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range .Values.networkPolicy.egress.databaseCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - protocol: TCP
          port: {{ $.Values.externalDatabase.port }}
    {{- end }}
    {{- if .Values.devDependencies.enabled }}
    {{- if .Values.devDependencies.mysql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "king-ai.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: mysql
      ports:
        - protocol: TCP
          port: 3306
    {{- end }}
    {{- end }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "king-ai.fullname" . }}
  labels:
    {{- include "king-ai.labels" . | nindent 4 }}
data:
  KING_AI_ALLOWED_ORIGINS: {{ .Values.api.allowedOrigins | default (ternary (printf "https://%s" .Values.ingress.host) "" .Values.ingress.enabled) | quote }}
  KING_AI_TRUST_FORWARDED_HEADERS: "true"
  KING_AI_TRUSTED_PROXY_HOPS: {{ .Values.api.trustedProxyHops | default 1 | quote }}
  KING_AI_COOKIE_SECURE: "true"
  KING_AI_BLOCK_PRIVATE_NETWORKS: "true"
  KING_AI_DEMO_ENABLED: "false"
  KING_AI_EXPORT_DIR: "/app/data/exports"
  KING_AI_EXPORT_STORAGE: {{ .Values.api.export.storage | default "local" | quote }}
  KING_AI_EXPORT_S3_ENDPOINT: {{ .Values.api.export.s3.endpoint | default "" | quote }}
  KING_AI_EXPORT_S3_BUCKET: {{ .Values.api.export.s3.bucket | default "" | quote }}
  KING_AI_EXPORT_S3_PREFIX: {{ .Values.api.export.s3.prefix | default "exports" | quote }}
  KING_AI_EXPORT_S3_REGION: {{ .Values.api.export.s3.region | default "" | quote }}
  KING_AI_FINOPS_QUOTA_ENABLED: {{ .Values.api.finops.quotaEnabled | default true | quote }}
  KING_AI_FINOPS_CURRENCY: {{ .Values.api.finops.currency | default "USD" | quote }}
  KING_AI_FINOPS_DEFAULT_INPUT_PRICE: {{ .Values.api.finops.defaultInputPricePerMillion | default 0 | quote }}
  KING_AI_FINOPS_DEFAULT_OUTPUT_PRICE: {{ .Values.api.finops.defaultOutputPricePerMillion | default 0 | quote }}
  KING_AI_LICENSE_ENABLED: {{ .Values.api.license.enabled | default false | quote }}
  KING_AI_LICENSE_FILE: {{ ternary (printf "%s/license.json" (.Values.api.license.mountPath | default "/app/license")) "" .Values.api.license.enabled | quote }}
  KING_AI_LICENSE_PUBLIC_KEY: {{ .Values.api.license.publicKey | default "" | quote }}
  JAVA_OPTS: {{ .Values.api.javaOpts | quote }}
  OTEL_TRACING_EXPORT_ENABLED: {{ .Values.observability.tracing.enabled | quote }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ .Values.observability.tracing.endpoint | quote }}
  KING_AI_TRACE_SAMPLE: {{ .Values.observability.tracing.sampleRate | quote }}

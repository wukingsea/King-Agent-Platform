{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled .Values.ingress.tls.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingress.tls.secretName }}
  labels:
    {{- include "king-ai.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ required "ingress.tls.crt is required when ingress.tls.create=true" .Values.ingress.tls.crt | b64enc | quote }}
  tls.key: {{ required "ingress.tls.key is required when ingress.tls.create=true" .Values.ingress.tls.key | b64enc | quote }}
{{- end }}

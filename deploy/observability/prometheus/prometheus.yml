global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: king-ai

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: king-ai-api
    metrics_path: /actuator/prometheus
    # When KING_AI_MANAGEMENT_TOKEN is set on the API, uncomment and mount the
    # token value into credentials_file so scrapes keep working:
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/king-ai.token
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: king-ai-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

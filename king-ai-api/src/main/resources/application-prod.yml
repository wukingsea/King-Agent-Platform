server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:king_ai}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&sslMode=${MYSQL_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:king}
    password: ${MYSQL_PASSWORD:king_ai_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  flyway:
    locations: classpath:db/migration/mysql
    # Demo migrations V2/V3 live outside the production location; installed demo-seeded databases still pass validation.
    ignore-migration-patterns: "versioned:missing"

king-ai:
  app-secret: ${KING_AI_SECRET:}
  encryption-key: ${KING_AI_ENCRYPTION_KEY:}
  previous-encryption-keys: ${KING_AI_PREVIOUS_ENCRYPTION_KEYS:}
  token-store: redis
  vector-store: milvus
  db-type: mysql
  milvus:
    base-url: ${MILVUS_URL:http://milvus:19530}
    token: ${MILVUS_TOKEN:}
  demo:
    enabled: ${KING_AI_DEMO_ENABLED:false}
  public-chat:
    rate-limit-per-minute: ${PUBLIC_RATE_LIMIT_PER_MINUTE:20}
  outbound:
    block-private-networks: ${KING_AI_BLOCK_PRIVATE_NETWORKS:true}
    allowed-hosts: ${KING_AI_ALLOWED_OUTBOUND_HOSTS:}
  security:
    trust-forwarded-headers: ${KING_AI_TRUST_FORWARDED_HEADERS:true}
    trusted-proxy-hops: ${KING_AI_TRUSTED_PROXY_HOPS:1}
    cookie-secure: ${KING_AI_COOKIE_SECURE:true}
    allowed-origins: ${KING_AI_ALLOWED_ORIGINS:}
  admin:
    username: ${KING_AI_ADMIN_USERNAME:admin}
    password: ${KING_AI_ADMIN_PASSWORD:}
    nickname: ${KING_AI_ADMIN_NICKNAME:平台管理员}
    space-name: ${KING_AI_ADMIN_SPACE_NAME:默认空间}
    space-code: ${KING_AI_ADMIN_SPACE_CODE:default}

logging:
  level:
    com.king.ai: INFO
    com.king.ai.chat: INFO
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:ecs}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_EXPOSURE:health,info,prometheus}
  endpoint:
    health:
      show-details: never
  tracing:
    enabled: true
    sampling:
      probability: ${KING_AI_TRACE_SAMPLE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
      export:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

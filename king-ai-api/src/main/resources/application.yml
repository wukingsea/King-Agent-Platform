spring:
  application:
    name: king-ai
  profiles:
    default: prod
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    async:
      request-timeout: 600000
  data:
    redis:
      connect-timeout: 2s
      timeout: 2s
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto

king-ai:
  app-secret: ${KING_AI_SECRET:king-ai-local-dev-secret-change-me}
  encryption-key: ${KING_AI_ENCRYPTION_KEY:}
  previous-encryption-keys: ${KING_AI_PREVIOUS_ENCRYPTION_KEYS:}
  session-ttl: 7d
  token-store: redis
  vector-store: milvus
  db-type: mysql
  audit:
    enabled: ${KING_AI_AUDIT_ENABLED:true}
    retention-days: ${KING_AI_AUDIT_RETENTION_DAYS:180}
  finops:
    quota-enabled: ${KING_AI_FINOPS_QUOTA_ENABLED:true}
    currency: ${KING_AI_FINOPS_CURRENCY:USD}
    default-input-price-per-million: ${KING_AI_FINOPS_DEFAULT_INPUT_PRICE:0}
    default-output-price-per-million: ${KING_AI_FINOPS_DEFAULT_OUTPUT_PRICE:0}
  compliance:
    pii:
      default-enabled: ${KING_AI_PII_DEFAULT_ENABLED:true}
      max-custom-rules: 20
      stream-holdback-chars: ${KING_AI_PII_STREAM_HOLDBACK:128}
    moderation:
      default-mode: ${KING_AI_MODERATION_MODE:OFF}
      fail-closed-on-error: ${KING_AI_MODERATION_FAIL_CLOSED:true}
      external-timeout-ms: ${KING_AI_MODERATION_TIMEOUT_MS:2000}
      external-url: ${KING_AI_MODERATION_URL:}
      external-token: ${KING_AI_MODERATION_TOKEN:}
    retention:
      enabled: ${KING_AI_RETENTION_ENABLED:false}
      dry-run: ${KING_AI_RETENTION_DRY_RUN:true}
      cron: ${KING_AI_RETENTION_CRON:0 0 3 * * *}
      batch-size: ${KING_AI_RETENTION_BATCH_SIZE:200}
      max-batches: 100
    export:
      root-dir: ${KING_AI_EXPORT_DIR:./data/exports}
      storage: ${KING_AI_EXPORT_STORAGE:local}
      s3:
        endpoint: ${KING_AI_EXPORT_S3_ENDPOINT:}
        access-key: ${KING_AI_EXPORT_S3_ACCESS_KEY:}
        secret-key: ${KING_AI_EXPORT_S3_SECRET_KEY:}
        bucket: ${KING_AI_EXPORT_S3_BUCKET:}
        prefix: ${KING_AI_EXPORT_S3_PREFIX:exports}
        region: ${KING_AI_EXPORT_S3_REGION:}
      poll-interval-ms: 10000
      ttl-hours: ${KING_AI_EXPORT_TTL_HOURS:24}
      max-rows: ${KING_AI_EXPORT_MAX_ROWS:1000000}
      batch-size: 500
    access-review:
      cron: ${KING_AI_ACCESS_REVIEW_CRON:0 0 4 1 1,4,7,10 *}
      stale-days: ${KING_AI_ACCESS_STALE_DAYS:90}
  release:
    require-approval: ${KING_AI_RELEASE_REQUIRE_APPROVAL:true}
    eval-pass-score: ${KING_AI_RELEASE_EVAL_PASS_SCORE:0.8}
    max-eval-cases: ${KING_AI_RELEASE_MAX_EVAL_CASES:20}
    eval-max-tokens: ${KING_AI_RELEASE_EVAL_MAX_TOKENS:512}
  sso:
    enabled: ${KING_AI_SSO_ENABLED:false}
    oidc:
      issuer: ${KING_AI_OIDC_ISSUER:}
      client-id: ${KING_AI_OIDC_CLIENT_ID:}
      client-secret: ${KING_AI_OIDC_CLIENT_SECRET:}
      redirect-uri: ${KING_AI_OIDC_REDIRECT_URI:}
      scopes: ${KING_AI_OIDC_SCOPES:openid,profile,email}
      role-claim: ${KING_AI_OIDC_ROLE_CLAIM:roles}
      default-space-code: ${KING_AI_OIDC_DEFAULT_SPACE_CODE:}
      default-role: ${KING_AI_OIDC_DEFAULT_ROLE:VIEWER}
      auto-create-users: ${KING_AI_OIDC_AUTO_CREATE_USERS:true}
      success-redirect: ${KING_AI_OIDC_SUCCESS_REDIRECT:/dashboard}
  mfa:
    enabled: ${KING_AI_MFA_ENABLED:true}
    issuer: ${KING_AI_MFA_ISSUER:King AI Platform}
    challenge-ttl: ${KING_AI_MFA_CHALLENGE_TTL:5m}
    recovery-code-count: ${KING_AI_MFA_RECOVERY_CODE_COUNT:8}
  ocr:
    enabled: ${KING_AI_OCR_ENABLED:false}
    command: ${KING_AI_OCR_COMMAND:tesseract}
    languages: ${KING_AI_OCR_LANGUAGES:chi_sim+eng}
    max-pages: ${KING_AI_OCR_MAX_PAGES:30}
    timeout-seconds: ${KING_AI_OCR_TIMEOUT_SECONDS:120}
    min-text-chars-per-page: ${KING_AI_OCR_MIN_TEXT_CHARS_PER_PAGE:50}
    render-dpi: ${KING_AI_OCR_RENDER_DPI:200}
  license:
    enabled: ${KING_AI_LICENSE_ENABLED:false}
    file: ${KING_AI_LICENSE_FILE:}
    public-key: ${KING_AI_LICENSE_PUBLIC_KEY:}
  chat:
    max-history-messages: 20
    max-history-chars: 24000
    max-input-chars: 10000
    max-tool-rounds: 6
    max-tool-result-chars: 8000
    llm-timeout-seconds: 180
    max-concurrent-per-space: ${KING_AI_CHAT_MAX_CONCURRENT_PER_SPACE:4}
    sse-capacity: ${KING_AI_SSE_CAPACITY:200}
  rag:
    max-context-chars: 8000
    embedding-batch-size: 16
    min-score: 0.1
  index:
    enabled: true
    poll-interval-ms: ${KING_AI_INDEX_POLL_INTERVAL_MS:15000}
    reconcile-interval-ms: 300000
    batch-size: 10
    max-attempts: ${KING_AI_INDEX_MAX_ATTEMPTS:5}
    retry-delay-seconds: 30
    stale-minutes: 30
  milvus:
    base-url: ${MILVUS_URL:http://localhost:19530}
    token: ${MILVUS_TOKEN:}
    timeout-seconds: 30
    collection-mode: ${MILVUS_COLLECTION_MODE:shared}
    collection-prefix: ${MILVUS_COLLECTION_PREFIX:king_ai_chunks_v2}
    partitions-num: ${MILVUS_PARTITIONS_NUM:64}
  local-vector:
    scan-batch-size: ${KING_AI_LOCAL_VECTOR_BATCH_SIZE:2000}
    max-scan: ${KING_AI_LOCAL_VECTOR_MAX_SCAN:200000}
  demo:
    enabled: false
  public-chat:
    rate-limit-per-minute: 20
  outbound:
    block-private-networks: ${KING_AI_BLOCK_PRIVATE_NETWORKS:true}
    allowed-hosts: ${KING_AI_ALLOWED_OUTBOUND_HOSTS:}
  security:
    trust-forwarded-headers: ${KING_AI_TRUST_FORWARDED_HEADERS:false}
    trusted-proxy-hops: ${KING_AI_TRUSTED_PROXY_HOPS:1}
    cookie-secure: ${KING_AI_COOKIE_SECURE:false}
    session-cookie-name: ${KING_AI_SESSION_COOKIE_NAME:king_session}
    allowed-origins: ${KING_AI_ALLOWED_ORIGINS:}
  admin:
    username: ${KING_AI_ADMIN_USERNAME:}
    password: ${KING_AI_ADMIN_PASSWORD:}
    nickname: ${KING_AI_ADMIN_NICKNAME:平台管理员}
    space-name: ${KING_AI_ADMIN_SPACE_NAME:默认空间}
    space-code: ${KING_AI_ADMIN_SPACE_CODE:default}

logging:
  level:
    root: INFO
    com.king.ai: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] [trace=%X{traceId:-} span=%X{spanId:-}] [%thread] %logger{40} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,stateStore,vectorStore
  health:
    redis:
      enabled: false
  info:
    env:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
      export:
        enabled: false
  metrics:
    distribution:
      "percentiles-histogram.[king.ai.chat.ttft]": true
      "percentiles-histogram.[king.ai.chat.duration]": true
      "percentiles-histogram.[king.ai.rag.retrieval]": true
      "percentiles-histogram.[king.ai.mcp.latency]": true
      "percentiles-histogram.[king.ai.index.duration]": true
      "percentiles-histogram.[king.ai.milvus.latency]": true
      "percentiles-histogram.[king.ai.redis.probe.latency]": true
      "slo.[king.ai.chat.ttft]": 1s,3s,5s,10s
      "slo.[king.ai.chat.duration]": 5s,15s,30s,60s,180s

info:
  app:
    name: King AI Platform
    version: "@project.version@"

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and verify
      run: mvn -B -ntp clean verify

    - name: Upload API jar
      uses: actions/upload-artifact@v4
      with:
        name: king-ai-api
        path: king-ai-api/target/king-ai-api.jar
        retention-days: 7

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-reports
        path: king-ai-api/target/surefire-reports/
        retention-days: 7

  backend-mysql:
    name: Backend MySQL integration tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run MySQL migration and isolation tests
      run: mvn -B -ntp -pl king-ai-api -am test -Dtest=MySqlMigrationTest -DfailIfNoTests=false

    - name: Upload MySQL test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-mysql-test-reports
        path: king-ai-api/target/surefire-reports/
        retention-days: 7

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: king-ai-ui

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: king-ai-ui/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Unit tests
      run: npm test

    - name: Type check and production build
      run: npm run build

    - name: Audit dependencies
      run: npm audit --audit-level=high

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: End-to-end tests
      run: npm run test:e2e

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          king-ai-ui/playwright-report/
          king-ai-ui/test-results/
        retention-days: 7

  security:
    name: Dependency, secret and misconfiguration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Review dependency changes
      if: github.event_name == 'pull_request'
      uses: actions/dependency-review-action@v4

    - name: Trivy scan
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret,misconfig
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'
        format: table
        skip-dirs: 'king-ai-ui/node_modules,king-ai-ui/dist,king-ai-api/target,.git'
        skip-files: '.env.example'

    - name: Generate SBOM
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: fs
        scan-ref: .
        format: cyclonedx
        output: artifacts/sbom.cdx.json
        scanners: vuln
        skip-dirs: 'king-ai-ui/node_modules,king-ai-ui/dist,king-ai-api/target,.git'

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: artifacts/sbom.cdx.json
        retention-days: 30

  deployment:
    name: Helm chart and backup scripts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: azure/setup-helm@v4
      with:
        version: v3.15.4

    - name: Install kubeconform
      run: |
        curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
        tar -xzf kubeconform.tar.gz kubeconform
        sudo mv kubeconform /usr/local/bin/kubeconform

    - name: ShellCheck
      run: |
        shellcheck deploy/helm/king-ai/tests/*.sh
        if compgen -G 'deploy/backup/*.sh' > /dev/null; then
          shellcheck deploy/backup/*.sh deploy/backup/tests/*.sh
        fi

    - name: Compose service guardrails
      run: |
        set -euo pipefail
        grep -q 'http://127.0.0.1:8080/actuator/health/readiness' docker-compose.yml
        grep -q 'UI_CPU_LIMIT' docker-compose.yml
        grep -q 'UI_MEMORY_LIMIT' docker-compose.yml

    - name: Render and validate chart
      run: deploy/helm/king-ai/tests/render_test.sh

    - name: Backup script tests
      if: hashFiles('deploy/backup/tests/run_all.sh') != ''
      run: deploy/backup/tests/run_all.sh

  observability:
    name: Observability config and load-test static checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install promtool
      run: |
        curl -sSLo prometheus.tar.gz https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz
        tar -xzf prometheus.tar.gz prometheus-2.55.1.linux-amd64/promtool
        sudo mv prometheus-2.55.1.linux-amd64/promtool /usr/local/bin/promtool
        promtool --version

    - name: Prometheus rules
      run: deploy/observability/prometheus/tests/verify.sh

    - name: Shell script lint
      run: |
        shellcheck --severity=error \
          deploy/observability/prometheus/tests/verify.sh \
          deploy/observability/grafana/validate.sh \
          deploy/observability/tests/verify.sh \
          loadtest/build-k6.sh \
          loadtest/render-baseline.sh \
          loadtest/tests/static_test.sh

    - name: Grafana dashboards
      run: deploy/observability/grafana/validate.sh

    - name: Load-test static checks
      run: loadtest/tests/static_test.sh

    - name: Compose and collector validation
      run: deploy/observability/tests/verify.sh

    - uses: azure/setup-helm@v4
      if: ${{ hashFiles('deploy/helm/king-ai/Chart.yaml') != '' }}
      with:
        version: v3.15.4

    - name: Render chart with observability enabled
      if: ${{ hashFiles('deploy/helm/king-ai/Chart.yaml') != '' }}
      run: |
        helm template king-ai deploy/helm/king-ai --namespace king-ai \
          --set observability.tracing.enabled=true \
          --set observability.tracing.sampleRate=0.2 > /dev/null

  docker:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build API image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: king-ai-api/Dockerfile
        push: false
        load: false
        tags: king-ai-api:ci
        cache-from: type=gha,scope=api
        cache-to: type=gha,mode=max,scope=api

    - name: Build UI image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: king-ai-ui/Dockerfile
        push: false
        load: false
        tags: king-ai-ui:ci
        cache-from: type=gha,scope=ui
        cache-to: type=gha,mode=max,scope=ui

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and verify
      run: mvn -B -ntp clean verify

    - name: Upload API jar
      uses: actions/upload-artifact@v4
      with:
        name: king-ai-api
        path: king-ai-api/target/king-ai-api.jar
        retention-days: 7

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-reports
        path: king-ai-api/target/surefire-reports/
        retention-days: 7

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: king-ai-ui

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: king-ai-ui/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type check and production build
      run: npm run build

    - name: Audit dependencies
      run: npm audit --audit-level=high

  security:
    name: Dependency, secret and misconfiguration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Review dependency changes
      if: github.event_name == 'pull_request'
      uses: actions/dependency-review-action@v4

    - name: Trivy scan
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret,misconfig
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'
        format: table
        skip-dirs: 'king-ai-ui/node_modules,king-ai-ui/dist,king-ai-api/target,.git'
        skip-files: '.env.example'

    - name: Generate SBOM
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: fs
        scan-ref: .
        format: cyclonedx
        output: artifacts/sbom.cdx.json
        scanners: vuln
        skip-dirs: 'king-ai-ui/node_modules,king-ai-ui/dist,king-ai-api/target,.git'

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: artifacts/sbom.cdx.json
        retention-days: 30

  docker:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build API image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: king-ai-api/Dockerfile
        push: false
        load: false
        tags: king-ai-api:ci
        cache-from: type=gha,scope=api
        cache-to: type=gha,mode=max,scope=api

    - name: Build UI image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: king-ai-ui/Dockerfile
        push: false
        load: false
        tags: king-ai-ui:ci
        cache-from: type=gha,scope=ui
        cache-to: type=gha,mode=max,scope=ui
